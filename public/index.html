<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Useless Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1c1a17;
      color: #ccc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      transition: background 0.6s ease;
    }

    /* Room lighting when on */
    body.is-on {
      background: #2a2416;
    }

    /* Ambient light cast on wall */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 42%, rgba(255,220,120,0) 0%, rgba(255,220,120,0) 100%);
      transition: background 0.6s ease;
      pointer-events: none;
      z-index: 0;
    }
    body.is-on::before {
      background: radial-gradient(ellipse 60% 50% at 50% 42%, rgba(255,220,100,0.13) 0%, rgba(255,200,80,0) 70%);
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #444;
      margin-bottom: 52px;
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
    }

    /* ─── WALL PLATE ─── */
    .wall-scene {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* Wall surface behind plate */
    .wall-bg {
      position: relative;
      padding: 30px;
      background:
        /* subtle paint texture via repeating gradients */
        repeating-linear-gradient(
          92deg,
          transparent,
          transparent 2px,
          rgba(255,255,255,0.008) 2px,
          rgba(255,255,255,0.008) 4px
        ),
        repeating-linear-gradient(
          180deg,
          transparent,
          transparent 3px,
          rgba(0,0,0,0.06) 3px,
          rgba(0,0,0,0.06) 6px
        ),
        linear-gradient(160deg, #d4c9b8 0%, #c8bfb0 40%, #bfb8aa 100%);
      border-radius: 4px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        0 6px 20px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    /* The actual switch faceplate */
    .faceplate {
      width: 116px;
      height: 192px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      /* Plastic material — layered gradients for that slight sheen */
      background:
        linear-gradient(160deg,
          rgba(255,255,255,0.18) 0%,
          rgba(255,255,255,0.04) 40%,
          rgba(0,0,0,0.04) 70%,
          rgba(0,0,0,0.10) 100%
        ),
        linear-gradient(180deg, #efefef 0%, #e0e0e0 100%);
      box-shadow:
        /* outer raised edge */
        0 1px 0 #fff,
        0 -1px 0 #bbb,
        1px 0 0 #e8e8e8,
        -1px 0 0 #d0d0d0,
        /* depth shadow */
        2px 4px 8px rgba(0,0,0,0.35),
        4px 8px 24px rgba(0,0,0,0.25),
        /* subtle inner glow on top edge */
        inset 0 1px 1px rgba(255,255,255,0.9),
        inset 0 -1px 1px rgba(0,0,0,0.08);
      transition: box-shadow 0.15s ease;
    }

    .faceplate:active {
      box-shadow:
        0 0px 0 #fff,
        0 -1px 0 #bbb,
        1px 0 0 #e8e8e8,
        -1px 0 0 #d0d0d0,
        1px 2px 4px rgba(0,0,0,0.3),
        2px 4px 14px rgba(0,0,0,0.2),
        inset 0 1px 1px rgba(255,255,255,0.9),
        inset 0 -1px 1px rgba(0,0,0,0.08);
    }

    /* Screws — top & bottom center */
    .faceplate::before,
    .faceplate::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 35%, #d8d8d8, #aaa 60%, #888 100%);
      box-shadow:
        0 1px 2px rgba(0,0,0,0.4),
        inset 0 0 2px rgba(0,0,0,0.3);
    }
    .faceplate::before { top: 12px; }
    .faceplate::after  { bottom: 12px; }

    /* Screw slot lines */
    .screw-slot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 7px;
      height: 1.5px;
      background: rgba(0,0,0,0.35);
      border-radius: 1px;
      pointer-events: none;
      z-index: 5;
    }
    .screw-slot.top    { top: 17px; }
    .screw-slot.bottom { bottom: 17px; }

    /* ─── ROCKER PADDLE ─── */
    .rocker-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 130px;
      perspective: 300px;
    }

    .rocker {
      width: 100%;
      height: 100%;
      position: relative;
      transform-origin: center center;
      transform-style: preserve-3d;
      /* Default (OFF): top tilted back, bottom tilted forward */
      transform: rotateX(0deg);
      transition: transform 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
    }

    /* The rocker body */
    .rocker-body {
      width: 100%;
      height: 100%;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
      /* Plastic surface */
      background: linear-gradient(180deg, #e8e8e8 0%, #d8d8d8 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.85),
        inset 0 -1px 0 rgba(0,0,0,0.12),
        inset 1px 0 0 rgba(255,255,255,0.5),
        inset -1px 0 0 rgba(0,0,0,0.08),
        0 2px 6px rgba(0,0,0,0.3);
    }

    /* Top half of rocker */
    .rocker-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      border-radius: 5px 5px 0 0;
      background: linear-gradient(180deg,
        #e4e4e4 0%,
        #d4d4d4 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.08);
    }

    /* Bottom half of rocker */
    .rocker-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      border-radius: 0 0 5px 5px;
      background: linear-gradient(180deg,
        #d8d8d8 0%,
        #e0e0e0 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 -2px 3px rgba(0,0,0,0.06);
    }

    /* Divider line between halves */
    .rocker-body::after {
      content: '';
      position: absolute;
      left: 6px; right: 6px;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.15) 20%, rgba(0,0,0,0.15) 80%, transparent);
      transform: translateY(-50%);
    }

    /* ON / OFF labels */
    .rocker-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #aaa;
      transition: color 0.2s;
      pointer-events: none;
    }

    /* Small indicator nub on rocker bottom */
    .rocker-nub {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, #c8c8c8, #b8b8b8);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 1px rgba(0,0,0,0.2);
      pointer-events: none;
    }

    /* ── OFF state: bottom is pressed in ── */
    /* The rocker tilts: top comes forward (shadow below it), bottom goes back */
    .rocker-body {
      transform-origin: center 50%;
    }

    /* OFF default tilt */
    .rocker-wrap {
      /* slight 3d tilt: OFF = bottom pressed */
    }

    /* ── ON state ── */
    .faceplate.on .rocker-top {
      background: linear-gradient(180deg,
        #d8d8d8 0%,
        #cacaca 100%
      );
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.18), inset 0 1px 2px rgba(0,0,0,0.12);
    }

    .faceplate.on .rocker-bottom {
      background: linear-gradient(180deg,
        #e8e8e8 0%,
        #f2f2f2 100%
      );
      box-shadow: 0 2px 3px rgba(0,0,0,0.06), inset 0 -1px 0 rgba(255,255,255,0.9);
    }

    .faceplate.on .rocker-label.on-label  { color: #555; }
    .faceplate.on .rocker-label.off-label { color: #ccc; }

    /* OFF state label colors */
    .faceplate .rocker-label.on-label  { color: #ccc; }
    .faceplate .rocker-label.off-label { color: #888; }

    /* ─── PILOT LIGHT (small LED on faceplate) ─── */
    .pilot-light {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff8888, #cc2222 60%, #880000);
      box-shadow: 0 0 3px 1px rgba(200,0,0,0.4);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .faceplate.on .pilot-light {
      background: radial-gradient(circle at 35% 30%, #aaff88, #22cc44 60%, #118822);
      box-shadow: 0 0 6px 2px rgba(50,220,80,0.7), 0 0 2px rgba(50,220,80,1);
    }

    /* ─── ROOM LIGHT (ceiling glow when on) ─── */
    .room-light {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,220,100,0.0), transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.6s ease;
    }
    body.is-on .room-light {
      background: radial-gradient(circle, rgba(255,220,100,0.22), transparent 70%);
    }

    /* ─── CLICK SPARK ─── */
    @keyframes spark {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(0.5); }
      60%  { opacity: 0.6; }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(2.5); }
    }

    .spark {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,240,180,0.9) 0%, transparent 70%);
      pointer-events: none;
      animation: spark 0.3s ease-out forwards;
      z-index: 10;
      top: 50%;
      left: 50%;
    }

    /* ─── STATS ─── */
    .stats {
      display: flex;
      gap: 40px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .stat-label {
      font-size: 0.68rem;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #888;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }

    body.is-on .stat-value { color: #aaa; }

    /* Achievement toast */
    #achievement {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      border: 1px solid #555;
      color: #ccc;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
    }

    #achievement.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #status-text {
      font-size: 0.85rem;
      color: #555;
      letter-spacing: 0.04em;
      height: 20px;
      transition: color 0.3s;
      position: relative;
      z-index: 1;
    }

    body.is-on #status-text { color: #998866; }

    .hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: #3a3a3a;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="room-light"></div>

  <h1>The Useless Game</h1>
  <p class="subtitle">a masterpiece of interactive entertainment</p>

  <div class="wall-scene">
    <!-- Wall bg area -->
    <div class="wall-bg">
      <!-- The switch faceplate -->
      <div class="faceplate" id="switch" onclick="flip()">
        <!-- Screw slots -->
        <div class="screw-slot top"></div>
        <div class="screw-slot bottom"></div>

        <!-- Pilot LED -->
        <div class="pilot-light"></div>

        <!-- Rocker paddle -->
        <div class="rocker-wrap">
          <div class="rocker-body">
            <div class="rocker-top">
              <span class="rocker-label on-label">ON</span>
            </div>
            <div class="rocker-bottom">
              <span class="rocker-label off-label">OFF</span>
            </div>
            <div class="rocker-nub"></div>
          </div>
        </div>
      </div>
    </div>

    <p id="status-text">The switch is OFF.</p>

    <div class="stats">
      <div>
        <div class="stat-label">Flips</div>
        <div class="stat-value" id="flip-count">0</div>
      </div>
      <div>
        <div class="stat-label">Time Wasted</div>
        <div class="stat-value" id="timer">0:00</div>
      </div>
    </div>

    <p class="hint">Click the switch. Seriously, that's the whole game.</p>
  </div>

  <div id="achievement"></div>

  <script>
    let on = false;
    let flips = 0;
    let start = Date.now();
    let achievementTimer = null;

    const switchEl    = document.getElementById('switch');
    const flipCount   = document.getElementById('flip-count');
    const timerEl     = document.getElementById('timer');
    const statusEl    = document.getElementById('status-text');
    const achievementEl = document.getElementById('achievement');

    const ACHIEVEMENTS = {
      1:    '"First Flip"',
      10:   '"Double Digits"',
      50:   '"Are You OK?"',
      100:  '"Centurion of Boredom"',
      500:  '"Deeply Committed"',
      1000: '"You Need Help"',
    };

    // Click sound synthesized via Web Audio
    function playClick() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        src.connect(gain);
        gain.connect(ctx.destination);
        src.start();
      } catch(e) {}
    }

    function spawnSpark() {
      const s = document.createElement('div');
      s.className = 'spark';
      switchEl.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }

    function flip() {
      on = !on;
      flips++;

      switchEl.classList.toggle('on', on);
      document.body.classList.toggle('is-on', on);

      flipCount.textContent = flips;
      statusEl.textContent = on ? 'The switch is ON.' : 'The switch is OFF.';

      playClick();
      spawnSpark();

      if (ACHIEVEMENTS[flips]) showAchievement('Achievement unlocked: ' + ACHIEVEMENTS[flips]);
    }

    function showAchievement(text) {
      clearTimeout(achievementTimer);
      achievementEl.textContent = text;
      achievementEl.classList.add('show');
      achievementTimer = setTimeout(() => achievementEl.classList.remove('show'), 3200);
    }

    setInterval(() => {
      const elapsed = Math.floor((Date.now() - start) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = String(elapsed % 60).padStart(2, '0');
      timerEl.textContent = `${m}:${s}`;
    }, 500);

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); flip(); }
    });
  </script>
</body>
</html>
